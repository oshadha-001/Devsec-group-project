name: mutillidae-group
services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mutillidae
      MYSQL_USER: mutillidae
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/root_password
    secrets: [db_password, root_password]
    volumes: [database-data:/var/lib/mysql]
    networks: [private]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 5s
      timeout: 5s
      retries: 30
  seed:
    build: .
    command: [php, /opt/group/seed.php]
    depends_on:
      database: {condition: service_healthy}
    secrets: [db_password, admin_password, user_password]
    networks: [private]
  web:
    build: .
    ports: ['127.0.0.1:8080:80']
    depends_on:
      seed: {condition: service_completed_successfully}
    secrets: [db_password, jwt_key]
    networks: [private, browser]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1/index.php') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 12
networks:
  private: {internal: true}
  browser: {}
volumes:
  database-data: {}
secrets:
  db_password: {file: ./.secrets/db_password.txt}
  root_password: {file: ./.secrets/root_password.txt}
  admin_password: {file: ./.secrets/admin_password.txt}
  user_password: {file: ./.secrets/user_password.txt}
  jwt_key: {file: ./.secrets/jwt_key.txt}
